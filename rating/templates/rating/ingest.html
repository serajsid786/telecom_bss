{% extends "rating/base.html" %}

{% block content %}
<h1>Ingest Usage Data Record (UDR)</h1>

{% if error %}
  <p style="color:red">{{ error }}</p>
{% endif %}

<form method="post">
  {% csrf_token %}
  <label> Service:
    <select name="service_id" required>
      {% for s in services %}
        <option value="{{ s.service_id }}">{{ s.name }} ({{ s.customer.external_id }})</option>
      {% empty %}
        <option value="">No services found - create via admin</option>
      {% endfor %}
    </select>
  </label>
  <br/>
  <label>Usage Class:
    <select name="usage_class">
      <option value="VOICE_BASIC">VOICE_BASIC</option>
      <option value="DATA_BASIC">DATA_BASIC</option>
      <option value="SMS_BASIC">SMS_BASIC</option>
    </select>
  </label>
  <br/>
  <label>Usage Amount:
    <input type="number" step="0.000001" name="usage_amount" value="00" />
  </label>
  <br/>
  <button type="submit">Ingest & Rate</button>
</form>

{% endblock %}
